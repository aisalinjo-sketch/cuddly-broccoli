name: Build Novaria Kernel

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            nasm \
            qemu-system-x86_64 \
            grub2-common \
            xorriso \
            ovmf \
            x86-64-elf-gcc

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=../toolchain.cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build kernel
        run: |
          cd build
          make -j$(nproc)

      - name: Create bootable ISO
        run: |
          cd build
          mkdir -p iso/boot/grub
          cp kernel.elf iso/boot/kernel.elf
          cp ../grub.cfg iso/boot/grub/grub.cfg
          grub-mkrescue -o novaria-0.1.0.iso iso

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novaria-kernel
          path: |
            build/kernel.elf
            build/novaria-0.1.0.iso
          retention-days: 30

      - name: Test boot in QEMU (smoke test)
        run: |
          cd build
          timeout 30 qemu-system-x86_64 \
            -cdrom novaria-0.1.0.iso \
            -serial stdio \
            -display none \
            -bios /usr/share/qemu/OVMF.fd \
            -m 256M || true

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download kernel artifacts
        uses: actions/download-artifact@v4
        with:
          name: novaria-kernel
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/kernel.elf
            artifacts/novaria-0.1.0.iso
          generate_release_notes: true